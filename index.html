<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Te amo Abby</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #fff0f5;
      font-family: 'Segoe Script', cursive;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      margin: 30px 10px;
      color: #c71585;
      font-size: 2.5rem;
      text-shadow: 2px 2px #ffe6f0;
    }

    .carousel-item {
      display: flex !important;
      justify-content: center;
      align-items: center;
      transition: opacity 1s ease-in-out;
    }

    .carousel.fade .carousel-item {
      opacity: 0;
      transition-property: opacity;
    }

    .carousel.fade .carousel-item.active,
    .carousel.fade .carousel-item-next.carousel-item-start,
    .carousel.fade .carousel-item-prev.carousel-item-end {
      opacity: 1;
      z-index: 1;
    }

    .polaroid {
      background: white;
      padding: 10px;
      border: 1px solid #ccc;
      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 220px;
      transform: rotate(-1deg);
      animation: fadeIn 1s ease-in-out;
    }

    .polaroid img {
      width: 100%;
      height: auto;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .petal {
      position: fixed;
      top: -50px;
      width: 20px;
      height: 20px;
      background-image: url('https://cdn-icons-png.flaticon.com/512/3459/3459528.png');
      background-size: cover;
      opacity: 0.8;
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 999;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 576px) {
      .polaroid {
        width: 80%;
      }
    }
  </style>
</head>
<body>
  <audio autoplay loop controls>
  <source src="Img/musica.mp3" type="audio/mpeg">
  Tu navegador no soporta el audio HTML5.
</audio>

  <h1>Nuestros increibles momentos 💜 📷</h1>

  <div class="container">
    <div id="carouselRomantico" class="carousel slide carousel-fade" data-bs-ride="carousel">
      <div class="carousel-inner">
        <!-- 12 Polaroid Items -->
        <div class="carousel-item active">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=1" alt="Foto 1"><p>Primer paseo 💕</p></div>
        </div>
        <div class="carousel-item">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=2" alt="Foto 2"><p>Risas eternas 🥰</p></div>
        </div>
        <div class="carousel-item">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=3" alt="Foto 3"><p>Tu mirada 💖</p></div>
        </div>
        <div class="carousel-item">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=4" alt="Foto 4"><p>Momentos mágicos ✨</p></div>
        </div>
        <div class="carousel-item">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=5" alt="Foto 5"><p>Atardecer juntos 🌅</p></div>
        </div>
        <div class="carousel-item">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=6" alt="Foto 6"><p>Tu sonrisa 💫</p></div>
        </div>
        <div class="carousel-item">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=7" alt="Foto 7"><p>Aventura ❤️</p></div>
        </div>
        <div class="carousel-item">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=8" alt="Foto 8"><p>Nuestro lugar 🏞️</p></div>
        </div>
        <div class="carousel-item">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=9" alt="Foto 9"><p>Viaje soñado ✈️</p></div>
        </div>
        <div class="carousel-item">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=10" alt="Foto 10"><p>Noche de estrellas 🌌</p></div>
        </div>
        <div class="carousel-item">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=11" alt="Foto 11"><p>Un beso 🎇</p></div>
        </div>
        <div class="carousel-item">
          <div class="polaroid"><img src="https://picsum.photos/220/280?random=12" alt="Foto 12"><p>Para siempre 💍</p></div>
        </div>
      </div>

      <!-- Controles -->
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselRomantico" data-bs-slide="prev">
        <span class="carousel-control-prev-icon bg-dark rounded-circle" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselRomantico" data-bs-slide="next">
        <span class="carousel-control-next-icon bg-dark rounded-circle" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </div>

  <!-- Caída de pétalos -->
  <script>
    function crearPetalo() {
      const petal = document.createElement('div');
      petal.classList.add('petal');
      petal.style.left = Math.random() * window.innerWidth + 'px';
      petal.style.animationDuration = (5 + Math.random() * 5) + 's';
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 10000);
    }
    setInterval(crearPetalo, 300);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
